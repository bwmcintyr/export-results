gateway_authenticator_maps:
  - name: AUTH_LDAP_TEAM_demo-admins_MAP
    authenticator: AUTH_LDAP
    order: 0
    map_type: team
    role: 'Team Member'
    organization: DEMO
    team: demo-admins
    revoke: True
    triggers:
      groups: 
        has_or: ['cn=demo-admins,ou=groups,dc=example,dc=com']
    state: present
